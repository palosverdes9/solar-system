name: build and test

on:
  workflow_dispatch:
    inputs:
      testing:
        description: "Test?"
        type: boolean
        required: false
      which_test?:
        description: "which test?"
        type: choice
        options:
          - unit
          - integeration
          - all
        required: false
      environment:
        description: "environment?"
        type: environment
        required: false
      build_number:
        description: "build number?"
        type: string
        required: false
      message:
        description: "any message"
        type: string
        required: false       

  push:
    branches: 
      - main
      - feature/*
      - "!test/**"

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}    

jobs:
  unit-testing:
    timeout-minutes: 10
    name: unit-testing
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        nodejs_version: [ 24.22, 22.23 ]
        include:
          - nodejs_version: 22
            os: ubuntu-latest
        exclude:
          - os: windows-latest
            nodejs_version: 24.22
          - os: windows-latest
            nodejs_version: 22.23
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
    
      - name: setup node JS version ${{matrix.nodejs_version}} on ${{matrix.os}}
        uses: actions/setup-node@v7
        with:
          node-version: '${{matrix.nodejs_version}}'

      - name: build
        run: npm install

      - name: test
        run: npm test

      - name: archive test results! 
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{matrix.nodejs_version}}
          path: test-results.xml
          retention-days: 1

  code-coverage:
    needs: unit-testing
    timeout-minutes: 10
    name: code-coverage
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
    
      - name: setup node JS version
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: build
        run: npm install

      - name: coverage
        run: npm run coverage

      - name: archive test results! 
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{github.job}}
          path: coverage
          retention-days: 1  
